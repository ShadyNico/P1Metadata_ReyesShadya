# ========================================
# INFORMACION DE LA APLICACION
# ========================================

# Nombre de nuestra aplicación
app.info.name=Gestor de Inventario

# Versión actual: Maven la reemplaza con la <version> del pom.xml
# al compilar (resource filtering de spring-boot-starter-parent).
app.info.version=@project.version@

# Descripción
app.info.description=API REST para gestionar el inventario

# Datos del desarrollador
app.info.developer.name=Shadya Nicole Reyes Zambrano
app.info.developer.email=misticjake123@gmail.com


# ========================================
# SERVIDOR
# ========================================

# Puerto donde se ejecutará Spring Boot
server.port=8080

# Al apagar, espera a que terminen las peticiones en curso
server.shutdown=graceful

# Comprime (gzip) las respuestas JSON grandes
server.compression.enabled=true
server.compression.min-response-size=1024


# ========================================
# LOGGING
# ========================================

# Además de la consola, guarda los logs en un archivo
logging.file.name=logs/proyecto1.log

# Formato de fecha de cada línea del log
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss


# ========================================
# BASE DE DATOS (H2 en memoria)
# ========================================

spring.datasource.url=jdbc:h2:mem:inventario
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update


# ========================================
# JSON (Jackson)
# ========================================

# No incluye en el JSON los campos que valen null
spring.jackson.default-property-inclusion=non_null

# JSON con sangría (más fácil de leer en curl)
spring.jackson.serialization.indent-output=true


# ========================================
# ACTUATOR
# ========================================

# Solo exponemos health e info por HTTP
management.endpoints.web.exposure.include=health,info

# /actuator/info muestra las propiedades info.*
management.info.env.enabled=true
info.app.name=Gestor de Inventario
info.app.version=@project.version@


# ========================================
# SEGURIDAD
# ========================================

# Nunca mostrar el stacktrace ni el mensaje interno en errores
server.error.include-stacktrace=never
server.error.include-message=never

# Cookie de sesión no accesible desde JavaScript
server.servlet.session.cookie.http-only=true


# ========================================
# PERFIL
# ========================================

# Perfil por defecto: desarrollo.
spring.profiles.active=dev
